# =============================================================================
# config.example.yaml — QA-BrainTumor-VLM-UCSF Project Configuration
# =============================================================================
# SETUP: Copy this file to config.yaml and fill in your paths.
#   cp config.example.yaml config.yaml
#
# config.yaml is gitignored (never committed). This example file is tracked.
#
# Variables can reference other variables using {variable_name} syntax.
# These are resolved at runtime by config_utils.py.
# =============================================================================

# ── Cluster / Repo Roots ──────────────────────────────────────────────────────
# Absolute path to the cloned repo on your cluster
project_root: /scratch/group/CX000019_DS1/vlm-brain-mri/QA-BrainTumor-VLM-UCSF-


# ── Data directories ─────────────────────────────────────────────────────────
# Root directory for raw NIfTI volumes (one subdirectory per patient, e.g. PDGM-0001_nifti/)
nifti_root: "{project_root}/datasets/UCSF-PDGM-v5"



# ── QA CSV datasets ───────────────────────────────────────────────────────────
qa_path: "{project_root}/datasets/qa_dataset.csv"
reshuffled_qa_path: "{project_root}/datasets/reshuffled_qa_dataset.csv"
human_qa_path: "{project_root}/datasets/human_dataset.csv"

# ── Output directories ────────────────────────────────────────────────────────
# All model result CSVs land here.
# Default: inside the repo (gitignored). On the cluster, set to scratch_root instead.
output_base: "{project_root}/QApairs"

# Format dataset — 2D slices and blank controls
slice_dir: "{output_base}/format_dataset/2D_slices"
mask_dir: "{output_base}/format_dataset/2D_slices/generated_masks"
blank_png: "{output_base}/format_dataset/blank/BlackedOut.png"
blank_nifti: "{output_base}/format_dataset/blank/BlackedOut.nii.gz"

# ── Model weights ─────────────────────────────────────────────────────────────
# Parent directory where all model weight folders live.
# Weights are stored inside the repo's gitignored models/ directory.
models_base: "{project_root}/models"

medgemma_model_path: "{models_base}/medgemma-1.5-4b-it"
med3dvlm_model_path: "{models_base}/Med3DVLM/src/model/Med3DVLM-Qwen-2.5-7B"
qwen_model_path: "{models_base}/Qwen2.5-7B-Instruct"
medimageinsight_model_path: "{models_base}/MedImageInsights"
lingshu_model_path: "{models_base}/Lingshu-32B"

# LLaVA-Med: model weights (relative path from its repo dir is typical)
llavamed_model_path: "{models_base}/LLaVA-Med_Extension/llava-med-v1.5-mistral-7b"
llavamed_repo_dir: "{models_base}/LLaVA-Med_Extension"

# ── SLURM defaults ────────────────────────────────────────────────────────────
log_dir: "{project_root}/logs"

# ── Segmentation model (used by best_slice_extraction_2d.py) ─────────────────
swinunetr_weights_path: "{models_base}/model_swinvit.pt"
